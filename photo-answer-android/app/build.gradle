plugins {
    id 'com.android.application'
}

android {
    namespace 'com.photoanswer'
    compileSdk 34

    defaultConfig {
        applicationId "com.photoanswer"
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName "1.5"
    }

    signingConfigs {
        release {
            storeFile file("../photoanswer.keystore")
            storePassword "photoanswer"
            keyAlias "photoanswer"
            keyPassword "photoanswer"
            enableV1Signing false
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.android.material:material:1.11.0'

    // 液态玻璃（LiquidGlass，支持 View 系统；来自 GitHub Abdullajon1881/LiquidGlass，
    // 未发布到 Maven Central，需先 clone 后 ./gradlew :liquidglass-view:publishToMavenLocal）
    implementation 'io.github.abdullajon1881:liquidglass-view:1.0.0'

    def camerax = "1.3.4"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
}
